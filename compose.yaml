# docker compose up --scale api=3
services:
  redis:
    image: redis:8-alpine

  fakemetno:
    build: .
    image: how-is-the-weather-at-api
    entrypoint: ["/usr/local/bin/fakemetno", "-port", "8081"]

  api:
    image: how-is-the-weather-at-api
    depends_on:
      - redis
      - fakemetno
    command:
      - -redis-url
      - redis://redis:6379
      - -upstream-url
      - http://fakemetno:8081/weatherapi/locationforecast/2.0/compact
      - -user-agent
      - how-is-the-weather-at-api-dev docker

  nginx:
    image: nginx:1-alpine
    depends_on:
      - api
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
