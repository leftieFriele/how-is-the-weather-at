# Spreads requests over all instances of the api service. Docker's DNS returns one address per instance;
# the resolver re-resolves every 10s, so instances added with --scale are picked up.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;

    location / {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_503;
    }
}
